电阻:
  基础知识: |
    ## 分压误差从灵敏度推导到预算

    设上臂为 $R_1$、下臂为 $R_2$，比例 $k=R_2/(R_1+R_2)$。对两个阻值求偏导后，一阶相对误差为

    $$\frac{\Delta k}{k}\approx(1-k)\left(\frac{\Delta R_2}{R_2}-\frac{\Delta R_1}{R_1}\right).$$

    对 90 kΩ/10 kΩ 分压，$k=0.1$；两只独立 ±0.1% 电阻反向取极值，比例最坏误差约 ±0.18%，并不是 ±0.1%。若二者 TCR 同为 +25 ppm/K 且同温，其共同漂移一阶抵消；若 TCR 差为 10 ppm/K、两只电阻同温升高 50 K，则另增约 450 ppm 比例误差。若两只电阻温升不同，则分别计算各自的 TCR×温升后再作差。阻值匹配和温漂跟踪比单只电阻的绝对精度更重要。

    后级负载 $R_L$ 应先并入 $R_2'=R_2\parallel R_L$ 再求比例。ADC 动态采样不能只用静态输入电阻代替：采样开关闭合后，分压的 Thevenin 电阻 $R_1\parallel R_2$ 决定建立时间。把初始容差、温漂、自热差、漏电和采样建立误差分别预算，校准只能消除被观测到且保持稳定的部分。
  特性与参数: |
    ## 功率、电压与脉冲的三重限制

    对某假设电阻，降额后允许功率为 $P_a=0.10$ W，连续工作电压上限为 75 V。允许电压是

    $$V_a=\min\left(\sqrt{P_aR},75\ \mathrm{V}\right).$$

    10 kΩ 时功率限制给出 31.6 V；100 kΩ 时按功率可到 100 V，但实际被 75 V 限制。封装相同并不意味着所有阻值具有同样的工作电压或脉冲能力。串联分压也要检查每只电阻在启动、开路故障和寄生电容分配下的瞬态应力。

    10 Ω 电阻承受 2 A、持续 100 μs 的矩形脉冲，瞬时功率为 40 W、单次能量为 4 mJ。仅计算低重复率下的平均功率会漏掉膜层热点；应按相同脉宽、重复率和阻值范围核对脉冲曲线。热噪声电压密度为 $\sqrt{4k_BTR}$，300 K、10 kΩ 约为 12.9 nV/√Hz；白噪声通过单极点低通时，等效噪声带宽为 $\pi f_c/2$，不是直接取 $f_c$。
  选型与应用: |
    ## 0 Ω 跳线与毫欧采样的验收方法

    0 Ω 的“0”是功能名称。假设某跳线最大电阻 50 mΩ，工作电流 2 A，则最坏压降可达 100 mV、功耗 0.2 W；额定电流、接触电阻、温升和焊盘尺寸必须分别满足要求。用作配置位时检查上电瞬间的外设冲突，用作分域供电调试点时预留电流测量位置。不能把普通 0 Ω 当作具有确定熔断时间的保险丝。

    10 mΩ 分流器测 5 A：信号 50 mV，耗散 0.25 W。若检测线共用 2 mΩ 功率铜箔，将多引入 10 mV，即 20% 系统误差；四线采样应从电阻端子规定的感测位置分别引出。若放大器失调为 50 μV，对应电流误差为 5 mA。按低电流精度确定失调预算，按满载确定功耗与自热，两个工作点要分别验收。

    调试记录至少包含四线实测阻值、冷态/热态输出、共模电压、放大器带宽与零电流偏置；用正负已知电流验证斜率和零点，避免用单个满载点掩盖偏置问题。
电容:
  基础知识: |
    ## 串联寄生模型与反谐振

    一阶器件模型为 $Z=ESR+j(\omega ESL-1/(\omega C))$，串联谐振频率 $f_s=1/(2\pi\sqrt{ESL\,C})$。假设有效容量 1 μF、ESL 为 1 nH，$f_s\approx5.03$ MHz；更高频率下继续增加容量不会消除 ESL 带来的阻抗上升。安装过孔与回流电感应并入 ESL，而不是只采用器件测试夹具中的数值。

    两个不同谐振频率的支路并联时，某频率处一支路呈感性、另一支路呈容性，导纳虚部可能互相抵消，形成高阻抗峰。计算应使用 $Z_{total}=1/(1/Z_1+1/Z_2)$ 并扫描频率；只比较两个器件的各自最低阻抗会漏掉峰值。ESR、负载和安装损耗提供阻尼，因此低 ESR 并非对所有网络都单调有利。

    验证时同时记录阻抗峰位置和幅值，并用实际直流偏置后的容量更新模型。时域负载脉冲可以激发该模态，但探头接地回路自身也会形成振铃，需要先排除测量引入的极点。
  特性与参数: |
    ## 有效容量与寿命预算不能混用

    假设 10 μF MLCC 在应用电压下只剩标称的 45%，温度系数取 85%，初始容差取 80%，则简化最坏有效容量为 $10\times0.45\times0.85\times0.8=3.06$ μF。这个乘积仅适用于各修正曲线的参考条件兼容时；厂商若给出了组合条件曲线，应优先采用组合值，避免重复降额。

    纹波发热应计算 $P\approx\sum I_{rms,n}^2ESR(f_n,T)$。例如 0.8 A RMS 流过 50 mΩ ESR，损耗为 32 mW，随后由实际热路径估算芯温。LCR 表在 1 kHz 测得的 ESR 不能直接代替 500 kHz 下数值。

    电解电容常见的温度寿命倍率是厂商特定经验模型。若用 $L=L_0 2^{(T_0-T)/10}$，必须说明它的有效温度区间及是否已包含纹波自热；不能无限外推到低温并宣称整机寿命。漏电、密封、纹波、振动和容量衰减判据仍需单独审查。
  选型与应用: |
    ## 从负载阶跃分解三个电压误差项

    在控制环尚未补足电流的时间段内，可近似写为

    $$\Delta V\approx ESL\frac{dI}{dt}+ESR\Delta I+\frac{1}{C}\int\Delta i(t)\,dt.$$

    假设负载增加 1 A、缺口持续 20 μs、允许总跌落 100 mV；ESR 为 20 mΩ，安装电感 1 nH，边沿为 1 A/100 ns。前两项分别为 20 mV 和 10 mV，留给容量的预算为 70 mV，因此理想有效容量下限约 286 μF。若电感电流逐步追上负载，积分面积可能小于矩形近似；应以电流缺口的实测面积替代猜测的延时。

    示波器需分别观察最初尖峰、随后阶跃和较慢的恢复过程。尖峰主要提示安装电感，瞬间台阶提示 ESR，后续斜率提示有效容量和环路响应；这是一种诊断线索，不能在多个模态耦合时直接一一等同。最终容量还要满足稳压器允许范围、启动电流与稳定性要求。
电感:
  基础知识: |
    ## Buck 电流斜率、纹波与 RMS 推导

    理想 Buck 在 CCM 中，导通段 $di/dt=(V_{in}-V_o)/L$，关断段为 $-V_o/L$。一周期电流回到原值给出伏秒平衡，得到 $D=V_o/V_{in}$ 与 $\Delta I_L=(V_{in}-V_o)D/(Lf_s)$。

    12 V 转 5 V、500 kHz、L=10 μH 时，$D=0.4167$，纹波约 0.583 A 峰峰值。3 A 负载下峰值约 3.292 A，谷值约 2.708 A；三角纹波的 RMS 平方平均给出 $I_{L,rms}=\sqrt{I_o^2+\Delta I_L^2/12}\approx3.005$ A。不能将峰值电流代入 DCR 铜损当作平均损耗。

    当谷值到零且控制器不允许反向电流时会进入 DCM，原占空比关系不再独立于负载。输入范围、L 负容差、磁芯温度和偏置降感应进入峰值计算；控制器限流采样的是峰值、谷值还是平均值，也决定故障边界。
  特性与参数: |
    ## 从电流斜率识别增量电感

    功率磁芯非线性时，电流波形反映的是增量电感 $L_{inc}=d\lambda/di$，因此 $di/dt=v_L/L_{inc}$。磁通链为 $\lambda$，储能严格表达为 $W=\int i\,d\lambda$；只有线性时才等于 $LI^2/2$。不能把小信号电感表的读数视作大电流下的常数。

    在同一导通段，若校正开关压降后的 $v_L$ 约为 6 V，电流斜率从 0.6 A/μs 增到 1.2 A/μs，对应增量电感从 10 μH 降到 5 μH，这是接近饱和的强线索。判定前要核对探头饱和、带宽和开关节点波形是否改变。

    Isat 必须带上降感百分比和温度；Irms 必须带上允许温升和测试板。3 A 流过热态 DCR=40 mΩ 产生 0.36 W 铜损，高频纹波还增加交流铜损与磁芯损耗。若使用广义 Steinmetz 类模型，系数、波形与材料适用范围须匹配，不能由单一频率额定值推出全部损耗。
  选型与应用: |
    ## 电感与限流配合的最坏点

    沿用 12 V/5 V、500 kHz、10 μH 的 Buck；若最低有效电感为 7 μH，纹波变为约 0.833 A。3 A 输出时峰值升至 3.417 A。若控制器限流最低保证值为 3.5 A，正常负载峰值已非常接近保护边界，还未计及频率容差、检测误差和瞬态过冲。

    选择更高饱和电流只能避免电感骤降，不能自动解决限流裕量不足；需同时调整电感量、控制器限流档位或负载动态要求。相反，控制器最大限流值应低于电感、MOSFET 和整流路径可承受的故障峰值，并计入传播延迟 $\Delta I=v_Lt_d/L$。

    验收覆盖最低/最高输入、冷启动、热启动、最大负载阶跃与短路恢复。保持同一电流探头去磁和归零条件，捕获逐周期峰值，而不只看平均电流。反馈线远离磁场热点；电感不是 Buck 输入热环路的全部，输入陶瓷电容到上下管的脉冲回路尤其需要收紧。
磁珠:
  基础知识: |
    ## 插入损耗必须与未插入时比较

    对串联磁珠 $Z_B$、源阻抗 $Z_S$、负载阻抗 $Z_L$，插入前后负载电压比为 $(Z_S+Z_L)/(Z_S+Z_B+Z_L)$。若定义正值代表衰减，则 $IL=20\log_{10}|(Z_S+Z_B+Z_L)/(Z_S+Z_L)|$。

    假设目标频点磁珠为纯阻性 100 Ω：在 50 Ω 源和 50 Ω 负载下，插损约 6.02 dB；在 1 Ω 源和 1 Ω 负载下，理想模型给出 34.2 dB。真实电源端口还含电容、电感与反馈，不能套用后一结果作为承诺。若 $Z_B$ 呈感性且负载含电容，分母可能变小，某频段甚至出现电压增益。

    调试时应保存“未装磁珠”和“装磁珠”的同条件频谱，电源 DC 工作点和探头负载必须一致；单独测磁珠两端压差不等于得到系统插损。
  特性与参数: |
    ## 偏置曲线与阻抗分量的选择

    两个器件都标 600 Ω@100 MHz，但一个在 10 MHz 主要为 $j80$ Ω，另一个为 $60+j20$ Ω，它们对 10 MHz 网络的阻尼作用不同。前者更可能与电容形成明显谐振，后者在该频点提供更大的耗散分量。比较应使用实际偏置和温度下的 R/X 曲线。

    若偏置后目标频点阻性分量由 60 Ω 降到 15 Ω，滤波效果必须重算；额定电流只证明厂家规定的热条件或其他限制，并不保证阻抗不变。直流压降为 $IR_{DC}$，高频噪声损耗需按频谱分量计算 $\sum I_{rms,n}^2R(f_n)$。

    台架可用偏置夹具加 VNA 测 S 参数，校准面移到器件焊盘；没有该设备时，用同一负载的频谱与阶跃对比确认效果。记录电源工作模式，避免把 PWM/PFM 切换造成的频谱变化误归因于磁珠。
  选型与应用: |
    ## 磁珠后级稳压器的稳定性检查

    受控开关变换器在其控制有效频带内近似保持恒功率，输入小信号电阻可为 $r_{in}\approx-V_{in}^2/P$。例如 5 V、5 W 负载得到约 −5 Ω。磁珠和输入电容构成的滤波器若在谐振处输出阻抗接近负载输入阻抗，会形成额外交互环路。

    $|Z_{source}|\ll|Z_{in}|$ 是常用的充分设计方向，但完整稳定性应看阻抗比的相位与 Nyquist 条件。可以增加阻尼支路、改变电容 ESR 或降低滤波器峰值；简单无限增大后级电容可能引入启动过流和新极点。

    验收依次测空载/满载、固定 PWM/节能模式、上电和负载阶跃。若磁珠后电压振荡而磁珠前稳定，优先调查滤波器与负载交互；短接磁珠只作为 A/B 诊断，最终还需复测目标 EMI 频带。
压敏电阻:
  基础知识: |
    ## 静态斜率与动态电阻

    在局部近似 $I=kV^\alpha$ 中，对电压求导得到动态电阻 $r_d=dV/dI=V/(\alpha I)$。若某工作点为 400 V、100 A、$\alpha=30$，局部动态电阻约 0.133 Ω；静态比值 $V/I=4$ Ω 与它不是同一参数。此模型只适用于拟合曲线邻域，不能覆盖漏电区到大电流区的全部行为。

    与浪涌源联立时使用 $V_s=I R_s+V_{MOV}(I)$。例如把源峰值简化为 1 kV、源阻抗 10 Ω，假设器件在相应电流附近残压约 400 V，则初始估计电流为 60 A，再回查 60 A 下的残压迭代。用源开路电压除以 MOV 标称压敏电压不会得到浪涌电流。

    电路中的电感压降还要叠加在器件端电压外：10 nH、1 kA/μs 已对应 10 V。保护端与器件端必须分开测，才能识别残压来自器件还是连接路径。
  特性与参数: |
    ## 脉冲能量与退化的可测指标

    若粗略假设钳位为 400 V、浪涌电流为峰值 100 A、底宽 20 μs 的三角波，则积分能量约为 $400\times100\times20\ \mu s/2=0.4$ J。这仅是计算示例，不能等同于标准 8/20 μs 波形，也不能直接拿来比较厂商的不同脉冲额定值。

    热稳态需满足 $P_{leak}(T)+P_{repeat}(T)=(T-T_a)/R_\theta$。在交点附近若发热随温度的增长斜率大于散热斜率 $1/R_\theta$，该平衡可能不稳定。持续过压时即便脉冲额定能量很大，也可能因漏电与温度正反馈失效。

    每组浪涌前后在相同温度下复测规定小电流处的压敏电压、工作电压下漏电和绝缘外观。采用器件或产品标准给出的漂移判据，不能把“没有炸裂”当作寿命验收通过。
  选型与应用: |
    ## 多级保护与熔断配合

    入口 MOV 与后级 TVS 并联在同一低阻抗节点时，钳位较低的器件可能承担大部分浪涌。要让多级分配能量，级间必须存在经过计算的串联阻抗或去耦网络，并核对该阻抗的脉冲功率、压降和绝缘要求。

    保险丝的 $I^2t$ 是熔断/耐受相关指标，MOV 的 $\int vi\,dt$ 是吸收能量，二者不能直接比较数值。应把预期故障电流波形同时施加到两套判据：正常浪涌不误断，持续失效时及时切断，并且分断能力覆盖现场预期短路电流。

    验证包括浪涌极性和次数、持续过压、保护器件失效后的电源路径、热脱扣动作及后级残压。对交流电源的测试方案需遵守设备绝缘和测量等级要求，测得的结果要关联具体源阻抗与安装结构。
二极管:
  基础知识: |
    ## 反向恢复电荷如何转化成开关损耗

    PN 结正向导通时储存少数载流子。电压反转后要先移除电荷，才能恢复阻断，因此反向电流并不瞬间为零。$Q_{rr}=\int |i_R(t)|dt$；用三角波近似时，$Q_{rr}\approx I_{RRM}t_{rr}/2$。

    假设 $I_{RRM}=2$ A、$t_{rr}=50$ ns，得到 $Q_{rr}\approx50$ nC。在硬换流、母线电压约 48 V、500 kHz 的简化条件下，系统因该电荷产生的损耗量级可估为 $VQ_{rr}f_s=1.2$ W；这不等于全部热量都在二极管内。实际能量应对二极管和开关管分别积分 $v(t)i(t)$，防止重复记账。

    $Q_{rr}$ 与正向电流、结温、$di/dt$ 和反向电压有关。肖特基主要避免少数载流子存储，但仍有结电容充放电电流，不能把“无反向恢复”解释为换流时没有电流尖峰。
  特性与参数: |
    ## 正向、反向与热三项损耗

    对电流波形，导通损耗为周期平均 $\langle V_F(i,T)i\rangle$。若用局部模型 $V_F=V_0+r_si$，则 $P_F=V_0I_{avg}+r_sI_{rms}^2$。例如 $V_0=0.35$ V、$r_s=0.08$ Ω，平均 1 A、RMS 1.4 A，估算损耗约 0.507 W。

    反向漏电损耗约为 $V_RI_R(T)$ 乘以阻断占空比。漏电随温度上升可能明显增加，尤其不能只用室温典型曲线进行热设计。再计入换流损耗，结合实际 PCB 的热路径求结温；数据手册 $R_{\theta JA}$ 的测试板不必等同于产品板。

    浪涌额定 IFSM 常绑定半正弦脉宽、初始结温和非重复条件。重复启动、电容充电或 PWM 脉冲需使用相应热阻抗与重复脉冲资料。反向耐压则覆盖钳位后尖峰和布局振铃，不仅是电源标称值。
  选型与应用: |
    ## 续流钳位对释放时间的影响

    对线圈断电，定义钳位电压 $V_C$ 为作用在线圈两端、使电流下降的近似恒压，则 $Ldi/dt=-V_C-Ri$。忽略绕组电阻时，释放时间约 $t=LI_0/V_C$；计入电阻后为 $t=(L/R)\ln(1+RI_0/V_C)$。

    10 mH、初始 0.2 A 的线圈储能为 0.2 mJ。用约 0.7 V 的低压续流通道，忽略 R 时下降时间约 2.86 ms；允许 24 V 反向钳位时约 83 μs。更快释放带来更高开关端电压与 EMI，需要同时验算 MOSFET 耐压、钳位器件能量和重复热负荷。

    示波器同时测开关管端电压和线圈电流，确认钳位极性、实际电流衰减与机械释放时间。开关端对地电压还可能叠加供电电压，不能把线圈反向钳位值直接作为 MOSFET VDS 峰值。
TVS:
  基础知识: |
    ## 芯片承受的电压不等于 TVS 端电压

    在局部区间可写 $V_{TVS}\approx V_0+r_dI$；受保护引脚电压还包含回路电感和公共地阻抗：$V_{pin}\approx V_{TVS}+L_{loop}di/dt+I R_{shared}$。用静态击穿电压代替整个表达式，会低估快速事件的应力。

    假设器件在目标脉冲附近 $V_0=8$ V、动态电阻 0.4 Ω，峰值电流 5 A，则器件端约 10 V。若保护回路有 5 nH、电流斜率为 2 A/ns，仅电感项就增加 10 V；把器件换成更低的标称电压可能仍无法解决布局引起的过冲。

    此线性化示例不代表任何具体 TVS。TLP 曲线、标准浪涌曲线和系统 ESD 的脉宽/边沿不同，不能直接把一个条件下的动态电阻外推到另一类事件。
  特性与参数: |
    ## 信号完整性中的电容预算

    单线节点并联电容的简化极点为 $f_p=1/(2\pi R_sC_j)$。假设有效源阻抗为 50 Ω、TVS 与焊盘总电容 2 pF，极点约 1.59 GHz。这个一阶模型可快速判断量级，但差分接口还涉及两线不平衡、封装电感、回波损耗和共模转换，应按实际 S 参数评估。

    结电容会随偏置变化，应核对数据手册的测试频率、信号幅度和反向偏置。器件首页“低电容”可能是典型值，也可能是某个端口组合的值；共模/线间电容定义不同。

    电源端的 VRWM 覆盖连续最高电压；VBR 对应规定测试电流；VC 对应规定峰值电流及波形。需要同时满足正常不误导通和故障时后级可承受两个约束。没有后级瞬态耐受资料时，不能仅凭绝对最大值认定保护已经充分。
  选型与应用: |
    ## 24 V 入口的联合求解示例

    假设持续最高输入 28 V，选取 VRWM 高于该值的候选器件；简化浪涌源为 100 V、10 Ω。若候选器件在目标区间的模型是 $V_{TVS}=35+1.5I$，则 $I=(100-35)/(10+1.5)\approx5.65$ A，器件端约 43.5 V。下一步必须把该工作点放回真实脉冲曲线，而不是把模型值作为规格。

    若后级瞬态耐受仅 40 V，该候选方案即使 VRWM 合适也不成立。可研究级间限流、前级钳位、提高后级耐受或采用主动保护。电感过冲和温度下钳位变化还会进一步压缩裕量。

    验收测量 TVS 端、后级引脚端和泄放回路电流，记录探头延时校正与带宽。脉冲后复测漏电和功能，分别检查一次通过与重复冲击退化；外观完好不等于参数未变化。
PPTC:
  基础知识: |
    ## PPTC 是电热反馈器件

    可用集总模型 $C_{th}dT/dt=I^2R(T)-(T-T_a)/R_{th}$ 描述。温度接近材料转变区后，$R(T)$ 上升，电源和负载共同决定后续电流。电流源驱动与电压源驱动产生的反馈不同，不能只用常温电阻推算动作全过程。

    电压源下，$I=V/(R_{source}+R_{PPTC}(T)+R_{load})$。动作后电流减小，但器件仍需少量功耗维持热态，因此并不形成真正开路。若下游电路在几毫安漏流下仍会处于异常供电状态，应另设电子开关或电源断开机制。

    复位取决于断电时间、环境温度和散热。热态重新上电可能立即再次动作，动作后的阻值恢复也有时间依赖；验证必须记录冷却条件。
  特性与参数: |
    ## 保持电流和动作曲线分别解决不同问题

    假设器件在 25 °C 的 Ihold 为 1 A，而厂家温度曲线在 70 °C 给出 0.6 的保持电流系数，则热环境下估计只可保持约 0.6 A。连续负载 0.7 A 已不能由室温额定值证明不会误动作。该系数属于示例，不能移植到其他器件。

    Itrip 不是精确比较器阈值；时间-电流曲线表明动作有延迟且受初始温度影响。要将启动浪涌持续时间与最低动作时间边界比较，并将故障持续时间与被保护器件的损坏曲线比较。动作时间量级若为秒，就不能期待其直接拦截纳秒级 ESD 或微秒级半导体短路。

    额定电压应覆盖动作后器件两端可能出现的最高电压，最大故障电流应覆盖电源可提供的短路电流。测试需记录板上散热铜箔和邻近热源，因为安装条件会改变保持与复位行为。
  选型与应用: |
    ## 与 TVS、负载启动电流协同验证

    PPTC 和 TVS 组成的保护网络中，TVS 可能在 PPTC 充分升温前就吸收了大量能量。应对整段故障过程计算 $E_{TVS}=\int V_{TVS}(t)I(t)dt$，并同时跟踪 PPTC 温升，不能仅根据 PPTC 最终会动作判断 TVS 安全。

    验证矩阵至少含冷态最大负载启动、最高环境连续运行、硬短路、有限阻抗短路和反复断电复位。对电容输入负载，量取实际浪涌而不只计算 $CV$；线缆、电源限流与 ESR 会改变峰值和持续时间。

    若验收要求故障后负载完全断电，普通 PPTC 的热态漏流不满足该功能定义，应增加具有明确关断状态的保护器件。报告中把“限制故障电流”“保持隔离”“自动恢复”三个目标分别列出。
三极管:
  基础知识: |
    ## 从偏置点推导增益与输入阻抗

    在正向有源区，$I_C\approx I_Se^{V_{BE}/V_T}$，小信号跨导 $g_m=I_C/V_T$，$r_\pi=\beta/g_m$。25 °C 时 $V_T\approx25.7$ mV；若 $I_C=1$ mA、$\beta=100$，则 $g_m\approx38.9$ mS、$r_\pi\approx2.57$ kΩ。这里的 β 是工作点附近的小信号值，并非任意电流下不变。

    未旁路发射极电阻 $R_E$ 提供局部反馈，忽略 Early 效应且 β 较大时，基极到集电极增益近似为 $A_v\approx-g_m(R_C\parallel R_L)/(1+g_mR_E)$。取 $R_C\parallel R_L=2$ kΩ、$R_E=100$ Ω，增益约 −15.9；基极输入阻抗约 $r_\pi+(\beta+1)R_E=12.7$ kΩ。

    若输入幅度使瞬时集电流明显偏离偏置，指数非线性、饱和和截止会使小信号增益失效。应同时检查静态余量和最大输出摆幅，不能只计算一个增益数值。
  特性与参数: |
    ## 饱和压降与存储时间的折衷

    把 BJT 用作开关时，可用强迫 β=$I_C/I_B$ 规定驱动。假设目标集电流 100 mA、强迫 β=10，需要基极电流 10 mA。3.3 V 驱动、估计 $V_{BE}=0.8$ V，忽略 GPIO 输出压降时，电阻约 250 Ω；实际还需纳入 GPIO 在该电流下的 VOH 保证值及引脚电流限制。

    更大的基极电流可能降低 VCE(sat)，但深饱和会增加存储电荷，使关断延时变长。查 VCE(sat) 必须同时查规定的 IC/IB；查开关时间必须看基极反向抽取电流、负载电路与温度。电路在导通时低损耗，不代表在高频 PWM 下总损耗更低。

    线性应用还需检查二次击穿对应的 SOA，不能仅以 $V_{CE}I_C$ 小于额定功率判定安全。并联分流依赖发射极电阻、热耦合和器件匹配，VBE 的温度特性会影响电流均衡。
  选型与应用: |
    ## 集电极开路转换与边沿预算

    集电极开路节点由上拉电阻和总电容形成充电时间常数，10%–90% 上升时间近似 $2.2R_PC_L$。假设 $R_P=4.7$ kΩ、$C_L=100$ pF，则上升时间约 1.03 μs。降低上拉到 1 kΩ 可把该项降到约 220 ns，但低电平时 5 V 电源需要约 5 mA 灌电流，导通损耗与基极驱动也要重新核对。

    该关系仅描述释放后的 RC 过程，未包含饱和存储时间、走线传输线效应和接收器阈值。用示波器同时观察基极电流或基极电压、集电极电压，区分“晶体管尚未退出饱和”与“退出后上拉太慢”。

    用作电平转换时检查最高集电极电压、断电状态漏电、外部上拉导致的反向供电以及反相逻辑。发射极跟随器输出约为基极电压减 VBE，不能按理想高边开关理解。
MOS管:
  基础知识: |
    ## 米勒平台决定换流时间

    在硬开关期间，栅极电荷分段改变。米勒平台附近，栅电流主要推动漏源电压变化，近似 $t_{M}=Q_{gd}/I_g$；$I_g\approx(V_{drv}-V_{plateau})/(R_{drv}+R_g+R_{g,int})$。

    假设驱动 10 V、平台 4 V、总电阻 6 Ω、Qgd=12 nC，则平台电流约 1 A，估计换流时间约 12 ns。该估算必须对应 Qgd 的母线电压、电流条件，并考虑驱动器电流限制与源极反弹。不能用 Ciss×总电阻代替全部大信号开关过程。

    电压、电流近似线性交叠时，单次换流能量量级为 $VI t/2$。48 V、10 A、12 ns 得约 2.88 μJ；实际还包含二极管恢复、输出电容和寄生振荡，需用同步校正的 $v_{DS}$、$i_D$ 积分验证。探头延时误差在纳秒边沿上足以改变损耗结论。
  特性与参数: |
    ## Coss、Eoss、SOA 与热态电阻

    MOSFET 输出电容随电压变化，储能应按 $E_{oss}(V)=\int_0^V vC_{oss}(v)dv$ 求得。只有电容近似常数时才可用 $CV^2/2$。数据手册给出的能量等效电容、时间等效电容和某一点的 Coss 定义不同，不能互换。

    假设热态 RDS(on)=15 mΩ，RMS 电流为 10 A，导通损耗是 1.5 W。若误用室温 10 mΩ，会漏算 0.5 W；温升又反过来提高电阻，应迭代热电工作点。栅阈值 VGS(th) 通常在很小漏电流下测试，不能用于判断功率电流下充分导通。

    热插拔、线性限流和慢速软启动需检查对应脉宽与温度的 SOA，并关注局部热不稳定。开关额定电流、单脉冲雪崩能量和直流 SOA 是不同约束；器件有雪崩额定不代表可把每次关断都设计成反复雪崩而无需寿命论证。
  选型与应用: |
    ## 高 dv/dt 误导通的计算与测点

    关断器件受到对侧换流影响时，漏栅电容注入 $i_M\approx C_{gd}dv_{DS}/dt$。若在相关区间取 20 pF、斜率 20 V/ns，瞬时电流约 0.4 A；经过 5 Ω 关断回路可形成约 2 V 栅压扰动，尚未计及公共源电感。Cgd 非线性，数值用于估计量级。

    应在器件 Gate 与 Kelvin Source 之间测 VGS，而非 Gate 对远端控制地。关断电阻、米勒钳位、负压关断和隔离驱动器 CMTI 各有适用条件；调整后要同时检查负 VGS、驱动振铃、开关损耗和死区。

    半桥验证覆盖最高母线、最大换流电流和最高温度，观察两只管的局部 VGS、直通电流及 VDS 过冲。先用受控能量的双脉冲工况建立基线，再进入连续开关热验证；只看最终温升无法区分误导通与正常开关损耗。
IGBT:
  基础知识: |
    ## 尾电流与开关频率上限

    IGBT 的电导调制降低导通压降，但关断时需要清除存储载流子。尾电流与上升中的 VCE 交叠，形成 $E_{off}=\int v_{CE}i_Cdt$。测试电流、母线电压、结温和栅电阻变化都会影响结果。

    若某假设工作点 Eon=0.8 mJ、Eoff=1.2 mJ，在 20 kHz 下开关损耗约 40 W。若导通电流波形对应平均导通损耗为 20 W，总器件损耗至少约 60 W，尚需检查二极管损耗和热耦合。把频率翻倍会近似翻倍开关损耗，但不会同样翻倍全部导通损耗。

    简化导通模型 $V_{CE}=V_0+r_{CE}I_C$ 可用于一个工作区间的积分，不能把 VCE(sat) 当固定电阻。设计选择应由实际波形下的总损耗与热约束确定，而不是只比较首页导通压降。
  特性与参数: |
    ## 瞬态热阻与测试条件归一

    对从热平衡起点开始的单个矩形功率脉冲，结壳温升约为 $\Delta T_{JC}=PZ_{\theta JC}(t)$。假设 500 W、1 ms 脉冲且该时刻 ZθJC=0.02 K/W，温升约 10 K；不能用稳态 RθJC 直接替代，也不能把该单脉冲结果直接用于持续脉冲列。

    周期脉冲需用热网络卷积或厂商占空比曲线考虑热积累，基准壳温本身还会随散热器升温。模块多芯片和二极管存在热耦合，逐颗孤立估算会偏乐观。

    比较 Eon/Eoff 时记录母线电压、IC、RG、VGE、Tj 和换流二极管。可在小范围内进行经验插值，但不能把能量按电压电流比例无限外推。短路耐受时间通常绑定电压、温度和栅压条件，与过流额定值不可互换。
  选型与应用: |
    ## 短路检测必须包含整个保护延迟

    保护延迟由消隐时间、检测滤波、比较器传播、隔离/驱动传播和关断过程组成。假设消隐 1.5 μs、其余检测传播 0.8 μs、软关断 1.2 μs，则故障能量累积至少持续约 3.5 μs；还需加入故障发生相对消隐窗口的最坏位置和参数容差。

    若器件对应工况短路耐受仅 5 μs，不能把 1.5 μs 差值直接视作已验证裕量。DESAT 阈值在正常大电流和温度下应有余量，软关断速度又必须限制 $L_{stray}di/dt$ 过压。

    调试先验证检测链路的延时和关断波形，再按受控母线能量逐级确认故障过程。检查驱动 UVLO、故障锁存、上下桥臂互锁和恢复策略；重复自动重启可能让每次都不超限的故障逐渐累积热量。
运算放大器:
  基础知识: |
    ## 信号增益、噪声增益与环路增益

    对反馈因子 β，闭环传递为 $A_{cl}=A/(1+A\beta)$，环路增益为 $T=A\beta$。理想闭环增益与实际值的相对偏差量级为 $1/|1+T|$，因此精度不仅由电阻比决定，还取决于信号频率处的开环增益。

    反相放大器信号增益为 $-R_f/R_{in}$，噪声增益为 $1+R_f/R_{in}$。假设 GBW=10 MHz、信号增益 −9，则噪声增益为 10，单主极点近似闭环带宽约 1 MHz。不能用信号增益的绝对值 9 直接求稳定性或带宽。

    若要求输出 5 V 峰值、100 kHz 正弦波，最低压摆率由 $SR\ge2\pi fV_{pk}$ 得约 3.14 V/μs。小信号带宽满足不代表大信号不失真；输入共模范围、输出摆幅与驱动电流还需逐项覆盖。
  特性与参数: |
    ## 噪声积分与电阻噪声

    输入等效噪声密度可近似组合为 $e_{eq}^2=e_n^2+(i_nR_s)^2+4k_BTR_s$，还要分别加入反馈电阻的传递贡献。300 K、10 kΩ 源阻抗的热噪声约 12.9 nV/√Hz；若运放电压噪声为 5 nV/√Hz、电流噪声为 1 pA/√Hz，对应电流噪声项为 10 nV/√Hz，三项合成约 17.1 nV/√Hz。

    白噪声通过单极点 10 kHz 低通，等效噪声带宽约 15.7 kHz，输入 RMS 约 2.14 μV；若存在 1/f 噪声，应从实际低频积分下限开始积分，不能把白噪声密度乘带宽覆盖全部频段。

    失调、偏置电流与噪声是不同误差。测失调时注意热电势和输入保护漏电；测噪声时防止电源纹波、工频和数字耦合被误当器件固有噪声。CMRR/PSRR 应按相关频率查曲线，直流典型值不能代表高频抑制。
  选型与应用: |
    ## 驱动 SAR ADC 的建立与稳定性

    ADC 采样开关使负载呈周期性电荷抽取。用等效一阶模型，若满幅阶跃要建立到 N 位的半 LSB，需 $e^{-t/\tau}\le2^{-(N+1)}$，即 $t\ge(N+1)\ln2\,\tau$。16 位约需 11.8 个时间常数；100 ns 采集窗口意味着单极点时间常数不宜超过约 8.49 ns。

    这只是必要的简化估计：运放闭环高阶响应、压摆率、采样电容、隔离电阻与储能电容都会改变误差。串联电阻可隔离容性负载，但也延长建立；并联电容可提供瞬时电荷，却增加驱动负担。应采用 ADC 推荐网络并验证多路切换的最大阶跃。

    用相邻通道交替输入高低电平的序列观察码值残留，比较采集时间和 RC 修改前后结果。固定输入的低噪声直方图只能检验稳态噪声，不能证明多路动态建立已经满足精度。
晶振:
  基础知识: |
    ## 晶体等效网络与负载牵引

    无源晶体的 BVD 模型由运动支路 $R_m,L_m,C_m$ 与静态电容 $C_0$ 并联构成。串联谐振为 $f_s=1/(2\pi\sqrt{L_mC_m})$；忽略损耗且 $C_m\ll C_0+C_L$ 时，负载谐振近似

    $$f_L\approx f_s\sqrt{1+\frac{C_m}{C_0+C_L}}.$$

    对负载电容微扰，一阶牵引约为 $\Delta f/f\approx-C_m\Delta C_L/[2(C_0+C_L)^2]$。假设 $C_m=0.01$ pF、$C_0+C_L=12$ pF，负载增加 1 pF，频率约下降 34.7 ppm。参数来自假设模型，实际需使用晶体厂商的等效参数和牵引曲线。

    两个接地负载电容的等效值约为 $C_L=C_1C_2/(C_1+C_2)+C_{stray}$。寄生包含芯片引脚、封装、走线和探头，不能只按两颗外接电容计算。已经带有有源振荡电路的时钟模块则不是这个外接负载调谐模型。
  特性与参数: |
    ## 驱动功率与起振裕量是两个指标

    晶体驱动功率可近似为 $DL=I_{m,rms}^2R_m$，其中电流是运动支路电流。若该电流为 0.3 mA RMS、Rm=60 Ω，则功率约 5.4 μW。引脚总电流还含 C0 的位移电流，直接混用会造成估算偏差。

    起振需要振荡电路提供的负阻幅值超过晶体的损耗电阻；实际设计须遵守 MCU 和晶体厂商的裕量要求。通过串入电阻测起振边界是一种实验方法，但应在断电后的冷启动、不同温度和供电角落测试，不能只看已经振荡的电路能维持到多大电阻。

    更强驱动可能改善启动，但也可能超出晶体最大 DL。验收同时记录最慢起振时间、稳态频偏、驱动等级和温度，避免只用频率正常就判定可靠。32.768 kHz 与 MHz 晶体在损耗和驱动等级上差异很大，配置不可照搬。
  选型与应用: |
    ## 探头加载与 ppm 测量误差

    10 pF 的普通被动探头相对十几 pF 的晶体负载并不小，接上探头后频偏或停振可能是测量改变了电路。优先观测缓冲时钟输出或使用低电容有源探头，并记录加载电容。探头接地回路还可能改变耦合和杂散响应。

    频率误差按 $ppm=(f_{meas}-f_{nom})/f_{nom}\times10^6$ 计算。24 MHz 晶体偏差 240 Hz 对应 10 ppm；若频率计参考源本身只有 ±5 ppm 准确度，就不足以严谨区分 2 ppm 的改进。

    冷启动失败要记录电源斜率、复位释放时序、振荡器驱动配置和固件时钟切换超时。把晶体换成同频型号时还要核对 ESR、CL、DL 与温度曲线；只有标称频率一致不能视作等效替代。
GDT:
  基础知识: |
    ## 从气体击穿到弧光维持

    GDT 击穿前主要表现为很小的电容和绝缘电阻；发生电离后进入辉光、弧光状态，其端电压显著低于击穿电压。击穿后的低弧压有利于分流大电流，但可能让供电源继续维持放电，形成续流。

    若电源 48 V、弧压近似 15 V、回路电阻 3 Ω，简单电路估算续流约 11 A。是否能熄弧还取决于器件、供电动态和电流过零条件；不能因浪涌已经结束就推断 GDT 自动恢复高阻。

    直流击穿值描述缓慢上升条件，快速电压上升时电离形成存在统计延迟，冲击击穿可能高得多。精密半导体接口通常需要后级快速保护与级间协调，不能只靠 GDT 标称击穿值限制引脚应力。
  特性与参数: |
    ## 冲击击穿与寄生电容的双重预算

    对高速接口，假设总并联电容 1 pF，在 1 GHz 时容抗约 $1/(2\pi fC)=159$ Ω；它虽很小，却仍需结合线路阻抗与封装布局评估回波损耗。多个保护件及焊盘寄生会累加。

    击穿参数应同时记录电压上升率，例如不同 V/μs 条件下的冲击击穿分布；只取一个直流击穿典型值不够。通流能力则需指定波形、次数、极性和放电后绝缘要求。三电极结构还需关注两侧同步性和差模残压。

    测试前后比较绝缘电阻、静态击穿和冲击击穿分布。击穿事件具有统计性，单次低残压结果不构成上限保证；系统的最坏应力由器件分散、触发时延、引线电感和后级保护共同决定。
  选型与应用: |
    ## GDT 与后级 TVS 的时间配合

    浪涌初期，后级 TVS 可能先导通并承担电流，随后 GDT 击穿把大部分能量分流。两级若缺少协调阻抗，TVS 可能把 GDT 两端电压钳得过低，导致 GDT 迟迟不触发。因此需要同时模拟“GDT 未触发”和“GDT 已触发”两个状态。

    记录 TVS 承担的预触发能量 $E_{pre}=\int_0^{t_{spark}}vi\,dt$，并检查协调电阻/电感的瞬态电压与热应力。GDT 导通后再次核对续流和熄弧；串联阻抗不能只按正常信号损耗选择。

    验收以保护端残压、两级分流电流及 GDT 触发时间为核心，同时检查网络接口功能恢复。对需要机壳泄放的设计，应把连接器、屏蔽壳和地结构纳入样机，独立器件台架并不能代表整机路径。
锂离子电池:
  基础知识: |
    ## 一阶电池模型与 SOC 估算误差

    一个可用于动态分析的模型为 OCV(SOC,T)、串联 R0 和并联极化支路 R1C1。放电端电压为 $V_t=OCV-I R_0-V_p$，极化状态满足 $dV_p/dt=-V_p/(R_1C_1)+I/C_1$。电流阶跃最初的电压跳变主要反映 R0，较慢恢复反映极化，静置后的电压才更接近 OCV。

    假设 2 A 阶跃引起最初 80 mV 下跌，则等效 R0 约 40 mΩ，包含连接片和测量路径；应使用 Kelvin 测量并说明采样时刻。不能把负载下电压直接映射为 SOC，尤其在平台较平或温度变化时。

    库仑计数采用 $SOC(t)=SOC_0-\int I\,dt/Q$（放电取正，t 用秒时 Q 用库仑；容量用 Ah 时分母还需乘 3600）。2 Ah 电芯若电流零偏为 1 mA，24 h 累积 24 mAh，即 1.2% 容量误差，还未计入容量老化和充放电效率。
  特性与参数: |
    ## 电芯规格到系统可用能量

    标称容量通常对应规定温度、倍率、截止电压和新电芯状态。能量应计算 $E=\int V I\,dt$；用 3.7 V×2 Ah 得到 7.4 Wh 只是名义估计，不能保证高倍率、低温或老化后的可用能量。

    若系统输出 5 V、0.5 A，假设转换效率为 90%、可用电池能量为 6 Wh，则估计运行时间 $t=6\times0.9/2.5\approx2.16$ h。效率随输入电压和负载变化，应分区积分；保护截止、电芯压降和待机电流都会减少可用时间。

    充电截止电压、温度范围、充电倍率和预充条件必须按具体化学体系与电芯规格。CC/CV 的充电终止电流并非过充保护阈值，系统负载还可能影响终止判定。温度传感器的位置和与电芯的热接触应列入验证。
  选型与应用: |
    ## 保护阈值、均衡与瞬态断流

    若用分流器检测过流，阈值近似 $I_{trip}=V_{th}/R_s$。假设阈值 50 mV、分流器 10 mΩ，则标称动作电流 5 A；阈值 ±10%、电阻 ±1% 时，最坏范围约为 4.46–5.56 A，须再考虑温漂与滤波延时。

    开关断流会让线缆电感产生 $Ldi/dt$。假设 1 μH 回路中的 5 A 在 100 ns 内下降，理论电感电压为 50 V；实际由 MOSFET 雪崩、吸收网络及寄生电容共同限制。应测保护关断瞬态，而不只测静态阈值。

    串联电芯被动均衡功率为 $V_{cell}^2/R_b$；4.2 V、100 Ω 支路电流约 42 mA、功率约 176 mW。均衡速度、板上温升和充电电流需要配合。电芯串数和单节过压/欠压保护应逐节验收，整包电压正常不能排除某一节异常。
存储器:
  基础知识: |
    ## 擦写寿命与写放大预算

    Flash 以擦除块为单位恢复可编程状态，更新一个小记录可能造成整块搬移。理想寿命可粗估为 $T\approx NEB/(W A)$：N 为均衡使用的块数，E 为每块擦写次数，B 为块大小，W 为逻辑写入速率，A 为写放大系数。必须同时核对保留时间与温度条件。

    假设 100 个 4 KiB 块、每块 10,000 次、每分钟更新 64 B、A=4，理想可写逻辑数据约 1.024 GB，对应约 30 年。这个数只是说明均衡写入的量级；若每次更新都擦同一块，10,000 分钟约 6.9 天就耗尽该块的标称周期。

    元数据和日志头也需要磨损均衡。温度升高、循环老化和长时间掉电会影响保持能力；“擦写次数够用”不能代替掉电后数据保持验收。
  特性与参数: |
    ## 接口时序需要建立完整预算

    同步读取的接收建立裕量可写成 $M=T_{sample}-t_{CO,max}-t_{flight}-t_{setup}-t_{skew}$。以一个假设 SPI 时序为例，采样间隔 10 ns、存储器输出延时 6 ns、线路延时 1 ns、主机建立时间 2 ns、抖动/偏斜预算 0.5 ns，剩余裕量仅 0.5 ns。

    采样间隔由 CPOL/CPHA、双沿传输和主机采样位置决定，不能直接把整个时钟周期带入。还要检查最短输出延时对应的保持裕量；降低频率通常改善建立，但未必修复固定相位造成的保持问题。

    对串行 Flash，最高时钟频率还可能绑定供电、温度、dummy cycles、驱动强度和具体读指令。对 SRAM/DRAM 则应按照各自协议分析，不能直接照搬 SPI 模型。测试用最大地址跨度和不同数据图样区分地址、时序及电源问题。
  选型与应用: |
    ## 掉电原子更新与错误检测

    更新关键配置可采用双槽日志：在非当前槽写入版本号、长度和负载，写完后读回核验，再最后写提交标记。启动时只接受提交标记、长度边界和 CRC 都有效的槽，并按可处理回绕的版本规则选择。最后写标记也必须符合芯片的最小编程粒度和掉电行为。

    CRC 检测传输或存储损坏，但不保证写入原子性；ECC 修正规定数量的位错误，也不等于应用记录完整。不能依赖一次页编程在电源跌落时必然“全部成功或全部失败”。

    测试在擦除、负载写入、校验和提交各阶段随机切断电源，重启后应得到旧记录或完整新记录。记录恢复耗时、坏块处理及写放大。若依靠电容维持完成写入，可用 $C\ge I\Delta t/\Delta V$ 初估，同时检查稳压器掉压和芯片最短电压要求。
模数与数模转换:
  ADC 转换: |
    ## 从量化误差推导 SNR，再检查采样建立

    理想均匀量化器的步长为 $q=V_{FS}/2^N$；在量化误差近似均匀且与信号不相关时，$\sigma_q=q/\sqrt{12}$。满幅正弦 RMS 为 $V_{FS}/(2\sqrt2)$，两者相除得到 $SNR\approx6.02N+1.76$ dB。小信号、相干量化误差、过载和非均匀量化不一定满足这些假设。

    12 位、3.3 V 单极性满量程的 q 约 805.7 μV，量化 RMS 约 232.6 μV，理想满幅正弦 SNR 约 74 dB。实际 ENOB 由 SINAD 推出，包含噪声与失真；不能把直流有效分辨率直接当成交流 ENOB。

    SAR 输入若等效为 10 kΩ 源阻抗与 20 pF 采样电容，时间常数为 200 ns。满幅变化建立到 12 位半 LSB 需要约 $13\ln2\times200$ ns=1.80 μs，尚未包含采样开关电阻。提高 ADC 时钟后采集时间缩短，可能先损失精度而不是先出现明显通信故障。
  DAC 转换: |
    ## 更新率、零阶保持与建立时间

    DAC 零阶保持的归一化幅频响应为 $|H(f)|=|\sin(\pi f/f_s)/(\pi f/f_s)|$。在输出频率 $f=0.4f_s$ 处约为 0.757，即 −2.42 dB，因此“更新率大于两倍信号频率”只涉及采样边界，不能保证幅度平坦或镜像抑制。

    重建滤波器应同时满足通带误差、镜像衰减和相位要求。阶跃建立时间要指定误差窗，例如半 LSB；压摆率限制决定大步进前段，闭环小信号带宽与振铃决定尾段。码间毛刺的面积常用 V·s 表示，不能仅以峰值高低比较。

    测试分别使用小码阶跃、满幅阶跃和主进位转换，加载实际输出电容与电阻。若 DAC 后接运放，需同时验证输出摆幅、共模范围、噪声与稳定性；DAC 分辨率并不保证端口具备同等绝对精度。
  精度与误差: |
    ## 校准前后误差预算的边界

    假设 16 位、2.5 V 满量程，1 LSB 约 38.15 μV。参考源初始误差 0.05% 对应满量程约 1.25 mV，即 32.8 LSB；若不校准，远大于量化步长。两点校准可主要移除稳定的偏置和增益误差，但不能消除 INL、动态建立误差、随机噪声及校准后的漂移。

    确定有界最坏误差时通常按绝对值累加；只有确认统计独立、零均值且分布适用的随机项，才采用 RSS 合成。把全部数据手册最大误差直接平方和开根，可能得到没有保证意义的结果。

    对参考温漂 5 ppm/K、温差 40 K，满量程漂移约 200 ppm，对 2.5 V 为 500 μV，即 13.1 LSB。测试应覆盖校准温度与应用温度、输入源阻抗、采样率和通道切换序列，并明确误差是以读数、满量程还是 LSB 为基准。
