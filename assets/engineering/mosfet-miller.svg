<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc">
<title id="title">米勒平台对应漏极电压转换</title><desc id="desc">上方栅源电压曲线在米勒段形成平台，下方漏源电压在同一电荷区间下降。Qgd除以平台栅极电流可估转换时间。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#507880"/></marker></defs>
<rect width="960" height="540" fill="#fff"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="30" y="43" font-size="28" fill="#263b43" text-anchor="start">米勒平台对应漏极电压转换</text><text x="30" y="77" font-size="17" fill="#657981" text-anchor="start">横轴是栅极电荷，不能直接把图中的水平宽度读作时间。</text><text x="55" y="132" font-size="21" fill="#167a9b" text-anchor="start">VGS</text><text x="55" y="286" font-size="21" fill="#c45842" text-anchor="start">VDS</text><line x1="120" y1="240" x2="875" y2="240" stroke="#263b43" stroke-width="2"/><line x1="120" y1="390" x2="875" y2="390" stroke="#263b43" stroke-width="2"/><line x1="120" y1="140" x2="120" y2="390" stroke="#e2e9ec" stroke-width="2"/><rect x="350" y="140" width="230" height="250" rx="0" fill="#b27a2312" stroke="none"/><polyline points="120,235 350,185 580,185 830,142" fill="none" stroke="#167a9b" stroke-width="3" stroke-linejoin="round"/><polyline points="120,285 350,285 580,380 830,380" fill="none" stroke="#c45842" stroke-width="3" stroke-linejoin="round"/><text x="205" y="270" font-size="19" fill="#263b43" text-anchor="start">Qgs</text><text x="460" y="270" font-size="19" fill="#b27a23" text-anchor="middle">Qgd</text><text x="740" y="270" font-size="18" fill="#263b43" text-anchor="start">后续充电</text><text x="465" y="165" font-size="18" fill="#b27a23" text-anchor="middle">米勒平台（示意）</text><text x="875" y="420" font-size="18" fill="#657981" text-anchor="end">累计栅极电荷 Qg →</text><rect x="30" y="447" width="900" height="70" rx="5" fill="#f1f6f6" stroke="none"/><text x="48" y="473" font-size="17" fill="#263b43" text-anchor="start">假设平台电荷 Qgd = 8 nC，平台平均栅极电流 0.20 A：转换段约 40 ns。</text><text x="48" y="500" font-size="17" fill="#657981" text-anchor="start">Qgd、平台电压与 VDS / ID 有关；图中平台高度和宽度不代表任何具体 MOSFET。</text></g></svg>
