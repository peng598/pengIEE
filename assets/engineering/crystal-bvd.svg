<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc">
<title id="title">石英晶体的 BVD 等效模型</title><desc id="desc">两端晶体由串联Rm、Lm、Cm的运动支路与静态电容C0并联构成。外部负载电容改变加载谐振频率，不能把标称负载频率直接当串联频率。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#507880"/></marker></defs>
<rect width="960" height="540" fill="#fff"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="30" y="43" font-size="28" fill="#263b43" text-anchor="start">石英晶体的 BVD 等效模型</text><text x="30" y="77" font-size="17" fill="#657981" text-anchor="start">运动支路 Rm / Lm / Cm 与静态电容 C0 并联；元件值来自等效拟合而非封装几何直接值。</text><line x1="90" y1="230" x2="170" y2="230" stroke="#263b43" stroke-width="2"/><line x1="170" y1="150" x2="170" y2="330" stroke="#263b43" stroke-width="2"/><line x1="800" y1="150" x2="800" y2="330" stroke="#263b43" stroke-width="2"/><line x1="800" y1="230" x2="875" y2="230" stroke="#263b43" stroke-width="2"/><circle cx="170" cy="230" r="4" fill="#263b43"/><circle cx="800" cy="230" r="4" fill="#263b43"/><line x1="170" y1="150" x2="233" y2="150" stroke="#263b43" stroke-width="2"/><rect x="233" y="138" width="64" height="24" rx="0" fill="#fff" stroke="#263b43"/><line x1="297" y1="150" x2="360" y2="150" stroke="#263b43" stroke-width="2"/><text x="265" y="126" font-size="18" fill="#263b43" text-anchor="middle">Rm</text><line x1="360" y1="150" x2="400" y2="150" stroke="#263b43" stroke-width="2"/><path d="M400 150 c0 -32 30 -32 30 0 c0 -32 30 -32 30 0 c0 -32 30 -32 30 0 c0 -32 30 -32 30 0" fill="none" stroke="#263b43" stroke-width="2"/><line x1="520" y1="150" x2="590" y2="150" stroke="#263b43" stroke-width="2"/><text x="460" y="111" font-size="19" fill="#263b43" text-anchor="middle">Lm</text><line x1="590" y1="150" x2="645" y2="150" stroke="#263b43" stroke-width="2"/><line x1="645" y1="128" x2="645" y2="172" stroke="#263b43" stroke-width="2"/><line x1="657" y1="128" x2="657" y2="172" stroke="#263b43" stroke-width="2"/><line x1="657" y1="150" x2="800" y2="150" stroke="#263b43" stroke-width="2"/><text x="651" y="111" font-size="19" fill="#263b43" text-anchor="middle">Cm</text><line x1="170" y1="330" x2="470" y2="330" stroke="#263b43" stroke-width="2"/><line x1="470" y1="308" x2="470" y2="352" stroke="#263b43" stroke-width="2"/><line x1="482" y1="308" x2="482" y2="352" stroke="#263b43" stroke-width="2"/><line x1="482" y1="330" x2="800" y2="330" stroke="#263b43" stroke-width="2"/><text x="477" y="297" font-size="19" fill="#263b43" text-anchor="middle">C0：静态电容</text><text x="200" y="225" font-size="20" fill="#167a9b" text-anchor="start">运动支路：机械损耗 / 惯性 / 弹性</text><text x="200" y="395" font-size="19" fill="#657981" text-anchor="start">外部有效负载 CL 跨接两端后，加载谐振频率向 fs 靠近。</text><rect x="30" y="447" width="900" height="70" rx="5" fill="#f1f6f6" stroke="none"/><text x="48" y="473" font-size="17" fill="#263b43" text-anchor="start">低损耗近似：fs = 1/(2π√(LmCm))；fL ≈ fs√[1 + Cm/(C0 + CL)]。</text><text x="48" y="500" font-size="17" fill="#657981" text-anchor="start">例：fs = 16 MHz，Cm = 10 fF，C0 = 3 pF，CL = 12 pF，则 fL ≈ 16.00533 MHz。</text></g></svg>
