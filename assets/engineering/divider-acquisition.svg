<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc">
<title id="title">分压精度还受采样建立时间限制</title><desc id="desc">90千欧与10千欧分压的输出通过采样开关连接20皮法电容。等效电阻9千欧，时间常数180纳秒，12位满幅建立需约1.62微秒。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#507880"/></marker></defs>
<rect width="960" height="540" fill="#fff"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="30" y="43" font-size="28" fill="#263b43" text-anchor="start">分压精度还受采样建立时间限制</text><text x="30" y="77" font-size="17" fill="#657981" text-anchor="start">电阻比决定静态增益；Thevenin 电阻决定对采样电容的充电速度。</text><text x="70" y="170" font-size="22" fill="#263b43" text-anchor="start">Vin</text><line x1="105" y1="180" x2="200" y2="180" stroke="#263b43" stroke-width="2"/><line x1="200" y1="180" x2="258" y2="180" stroke="#263b43" stroke-width="2"/><rect x="258" y="168" width="64" height="24" rx="0" fill="#fff" stroke="#263b43"/><line x1="322" y1="180" x2="380" y2="180" stroke="#263b43" stroke-width="2"/><text x="290" y="156" font-size="18" fill="#263b43" text-anchor="middle">R1 = 90 kΩ</text><line x1="380" y1="180" x2="520" y2="180" stroke="#263b43" stroke-width="2"/><circle cx="420" cy="180" r="4" fill="#263b43"/><line x1="420" y1="180" x2="420" y2="230" stroke="#263b43" stroke-width="2"/><rect x="408" y="230" width="24" height="64" rx="0" fill="#fff" stroke="#263b43"/><line x1="420" y1="294" x2="420" y2="330" stroke="#263b43" stroke-width="2"/><line x1="420" y1="330" x2="420" y2="340" stroke="#263b43" stroke-width="2"/><line x1="404" y1="340" x2="436" y2="340" stroke="#263b43" stroke-width="2"/><line x1="410" y1="347" x2="430" y2="347" stroke="#263b43" stroke-width="2"/><line x1="416" y1="354" x2="424" y2="354" stroke="#263b43" stroke-width="2"/><text x="455" y="267" font-size="18" fill="#263b43" text-anchor="start">R2 = 10 kΩ</text><circle cx="550" cy="180" r="4" fill="#263b43"/><line x1="520" y1="180" x2="550" y2="180" stroke="#263b43" stroke-width="2"/><line x1="550" y1="180" x2="602" y2="155" stroke="#263b43" stroke-width="2"/><circle cx="616" cy="180" r="4" fill="#263b43"/><line x1="616" y1="180" x2="730" y2="180" stroke="#263b43" stroke-width="2"/><text x="548" y="130" font-size="18" fill="#263b43" text-anchor="start">采样开关</text><line x1="730" y1="180" x2="730" y2="242.5" stroke="#263b43" stroke-width="2"/><line x1="710" y1="242.5" x2="750" y2="242.5" stroke="#263b43" stroke-width="2"/><line x1="710" y1="252.5" x2="750" y2="252.5" stroke="#263b43" stroke-width="2"/><line x1="730" y1="252.5" x2="730" y2="315" stroke="#263b43" stroke-width="2"/><text x="758" y="253.5" font-size="18" fill="#263b43" text-anchor="start">Cs = 20 pF</text><line x1="730" y1="315" x2="730" y2="325" stroke="#263b43" stroke-width="2"/><line x1="714" y1="325" x2="746" y2="325" stroke="#263b43" stroke-width="2"/><line x1="720" y1="332" x2="740" y2="332" stroke="#263b43" stroke-width="2"/><line x1="726" y1="339" x2="734" y2="339" stroke="#263b43" stroke-width="2"/><text x="160" y="390" font-size="21" fill="#167a9b" text-anchor="start">V∞ = 0.1 Vin</text><text x="470" y="390" font-size="21" fill="#167a9b" text-anchor="start">Rth = R1 ∥ R2 = 9 kΩ</text><rect x="30" y="447" width="900" height="70" rx="5" fill="#f1f6f6" stroke="none"/><text x="48" y="473" font-size="17" fill="#263b43" text-anchor="start">假设 Ron = 0，源阻抗为零：τ = Rth Cs = 180 ns；满量程阶跃按单极点建立。</text><text x="48" y="500" font-size="17" fill="#657981" text-anchor="start">12 位、误差 ≤ 0.5 LSB：tacq ≥ τ ln(8192) ≈ 1.62 μs；真实前端还要计入开关与驱动器。</text></g></svg>
