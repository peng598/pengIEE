<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc">
<title id="title">源端串联端接的行波往返</title><desc id="desc">匹配源端发出1.65伏行波，高阻接收端在单程延迟td时反射相同幅度并达到3.3伏，反射波在2td回到源端后被匹配吸收。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#507880"/></marker></defs>
<rect width="960" height="540" fill="#fff"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="30" y="43" font-size="28" fill="#263b43" text-anchor="start">源端串联端接的行波往返</text><text x="30" y="77" font-size="17" fill="#657981" text-anchor="start">纵向表示传播时间；图中两条竖线是源端和负载位置，不是电流方向。</text><text x="180" y="125" font-size="20" fill="#167a9b" text-anchor="middle">源端：Rdriver + Rs = Z0</text><text x="740" y="125" font-size="20" fill="#c45842" text-anchor="middle">接收端：高阻</text><line x1="180" y1="145" x2="180" y2="420" stroke="#657981" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="740" y1="145" x2="740" y2="420" stroke="#657981" stroke-width="1.5" stroke-dasharray="5 5"/><path d="M185,175 L735,285" fill="none" stroke="#167a9b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M735,285 L185,395" fill="none" stroke="#c45842" stroke-width="2.5" marker-end="url(#arrow)"/><text x="155" y="181" font-size="18" fill="#657981" text-anchor="end">0</text><text x="765" y="291" font-size="18" fill="#657981" text-anchor="start">td</text><text x="155" y="401" font-size="18" fill="#657981" text-anchor="end">2td</text><text x="455" y="205" font-size="20" fill="#167a9b" text-anchor="middle">发出 1.65 V 行波 →</text><text x="450" y="370" font-size="20" fill="#c45842" text-anchor="middle">← 反射 +1.65 V（ΓL = +1）</text><rect x="560" y="300" width="350" height="42" rx="5" fill="#f9efeb" stroke="none"/><text x="575" y="328" font-size="19" fill="#c45842" text-anchor="start">接收端在 td 时达到 3.3 V</text><rect x="30" y="447" width="900" height="70" rx="5" fill="#f1f6f6" stroke="none"/><text x="48" y="473" font-size="17" fill="#263b43" text-anchor="start">理想条件：3.3 V 阶跃，Rdriver = 15 Ω，Rs = 35 Ω，Z0 = 50 Ω，接收端开路。</text><text x="48" y="500" font-size="17" fill="#657981" text-anchor="start">源端反射系数 ΓS = 0，返回波在源端被吸收；途中分支或多个接收端会改变这一结论。</text></g></svg>
