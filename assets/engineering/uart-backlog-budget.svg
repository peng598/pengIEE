<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc">
<title id="title">UART 缓存必须容纳流控生效前的数据</title><desc id="desc">缓存先在5毫秒内积压461字节，停止等待2毫秒和另计64字节在途数据后，向上取整需710字节。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#507880"/></marker></defs>
<rect width="960" height="540" fill="#fff"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="30" y="43" font-size="28" fill="#263b43" text-anchor="start">UART 缓存必须容纳流控生效前的数据</text><text x="30" y="77" font-size="17" fill="#657981" text-anchor="start">假设发送始终满速；停止请求发出后仍有数据到达，不能等缓冲已满才拉流控。</text><line x1="100" y1="150" x2="100" y2="400" stroke="#e2e9ec" stroke-width="1"/><text x="100" y="425" font-size="16" fill="#657981" text-anchor="middle">0</text><line x1="287.5" y1="150" x2="287.5" y2="400" stroke="#e2e9ec" stroke-width="1"/><text x="287.5" y="425" font-size="16" fill="#657981" text-anchor="middle">2</text><line x1="475" y1="150" x2="475" y2="400" stroke="#e2e9ec" stroke-width="1"/><text x="475" y="425" font-size="16" fill="#657981" text-anchor="middle">4</text><line x1="568.75" y1="150" x2="568.75" y2="400" stroke="#e2e9ec" stroke-width="1"/><text x="568.75" y="425" font-size="16" fill="#657981" text-anchor="middle">5</text><line x1="756.25" y1="150" x2="756.25" y2="400" stroke="#e2e9ec" stroke-width="1"/><text x="756.25" y="425" font-size="16" fill="#657981" text-anchor="middle">7</text><line x1="850" y1="150" x2="850" y2="400" stroke="#e2e9ec" stroke-width="1"/><text x="850" y="425" font-size="16" fill="#657981" text-anchor="middle">8</text><line x1="100" y1="400" x2="850" y2="400" stroke="#e2e9ec" stroke-width="1"/><text x="88" y="406" font-size="16" fill="#657981" text-anchor="end">0</text><line x1="100" y1="341.8181818181818" x2="850" y2="341.8181818181818" stroke="#e2e9ec" stroke-width="1"/><text x="88" y="347.8181818181818" font-size="16" fill="#657981" text-anchor="end">256</text><line x1="100" y1="283.6363636363636" x2="850" y2="283.6363636363636" stroke="#e2e9ec" stroke-width="1"/><text x="88" y="289.6363636363636" font-size="16" fill="#657981" text-anchor="end">512</text><line x1="100" y1="225.45454545454544" x2="850" y2="225.45454545454544" stroke="#e2e9ec" stroke-width="1"/><text x="88" y="231.45454545454544" font-size="16" fill="#657981" text-anchor="end">768</text><line x1="100" y1="167.27272727272728" x2="850" y2="167.27272727272728" stroke="#e2e9ec" stroke-width="1"/><text x="88" y="173.27272727272728" font-size="16" fill="#657981" text-anchor="end">1024</text><line x1="100" y1="150" x2="100" y2="400" stroke="#263b43" stroke-width="2"/><line x1="100" y1="400" x2="850" y2="400" stroke="#263b43" stroke-width="2"/><text x="30" y="134" font-size="16" fill="#657981" text-anchor="start">占用 / B</text><text x="920" y="425" font-size="16" fill="#657981" text-anchor="end">ms</text><line x1="100" y1="167.27272727272728" x2="850" y2="167.27272727272728" stroke="#c45842" stroke-width="2" stroke-dasharray="6 5"/><polyline points="100,400 568.75,295.27 756.25,253.38 756.25,238.84 850,238.84" fill="none" stroke="#167a9b" stroke-width="3" stroke-linejoin="round"/><line x1="568.75" y1="150" x2="568.75" y2="400" stroke="#b27a23" stroke-width="1.5" stroke-dasharray="5 5"/><text x="145" y="156" font-size="18" fill="#c45842" text-anchor="start">容量 1024 B</text><text x="140" y="280" font-size="18" fill="#167a9b" text-anchor="start">5 ms 暂停：约 461 B</text><text x="600" y="205" font-size="18" fill="#167a9b" text-anchor="start">最终预算 ≥710 B</text><text x="500" y="365" font-size="17" fill="#b27a23" text-anchor="start">发停止请求</text><rect x="30" y="447" width="900" height="70" rx="5" fill="#f1f6f6" stroke="none"/><text x="48" y="473" font-size="17" fill="#263b43" text-anchor="start">921600 baud、8N1；停止响应额外 2 ms，再加未计入该时延的 64 B 在途数据。</text><text x="48" y="500" font-size="17" fill="#657981" text-anchor="start">为展示最坏积压，图中暂停服务；64 B 在终点汇总示意，不表示 UART 能瞬间传送。</text></g></svg>
