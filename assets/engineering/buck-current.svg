<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc">
<title id="title">Buck 电感电流：斜率、峰值与 RMS</title><desc id="desc">Buck电感电流在2.708安与3.292安之间呈三角波，导通0.833微秒，周期2微秒，虚线表示3安平均值。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#507880"/></marker></defs>
<rect width="960" height="540" fill="#fff"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="30" y="43" font-size="28" fill="#263b43" text-anchor="start">Buck 电感电流：斜率、峰值与 RMS</text><text x="30" y="77" font-size="17" fill="#657981" text-anchor="start">阴影为高侧开关导通区间；忽略压降、死区、饱和及控制器频率变化。</text><line x1="100" y1="150" x2="100" y2="400" stroke="#e2e9ec" stroke-width="1"/><text x="100" y="425" font-size="16" fill="#657981" text-anchor="middle">0</text><line x1="256.25" y1="150" x2="256.25" y2="400" stroke="#e2e9ec" stroke-width="1"/><text x="256.25" y="425" font-size="16" fill="#657981" text-anchor="middle">0.833</text><line x1="475" y1="150" x2="475" y2="400" stroke="#e2e9ec" stroke-width="1"/><text x="475" y="425" font-size="16" fill="#657981" text-anchor="middle">2.0</text><line x1="631.25" y1="150" x2="631.25" y2="400" stroke="#e2e9ec" stroke-width="1"/><text x="631.25" y="425" font-size="16" fill="#657981" text-anchor="middle">2.833</text><line x1="850" y1="150" x2="850" y2="400" stroke="#e2e9ec" stroke-width="1"/><text x="850" y="425" font-size="16" fill="#657981" text-anchor="middle">4.0</text><line x1="100" y1="368.74999999999994" x2="850" y2="368.74999999999994" stroke="#e2e9ec" stroke-width="1"/><text x="88" y="374.74999999999994" font-size="16" fill="#657981" text-anchor="end">2.7</text><line x1="100" y1="275" x2="850" y2="275" stroke="#e2e9ec" stroke-width="1"/><text x="88" y="281" font-size="16" fill="#657981" text-anchor="end">3.0</text><line x1="100" y1="181.25000000000003" x2="850" y2="181.25000000000003" stroke="#e2e9ec" stroke-width="1"/><text x="88" y="187.25000000000003" font-size="16" fill="#657981" text-anchor="end">3.3</text><line x1="100" y1="150" x2="100" y2="400" stroke="#263b43" stroke-width="2"/><line x1="100" y1="400" x2="850" y2="400" stroke="#263b43" stroke-width="2"/><text x="30" y="134" font-size="16" fill="#657981" text-anchor="start">iL / A</text><text x="920" y="425" font-size="16" fill="#657981" text-anchor="end">μs</text><rect x="100" y="150" width="156.25" height="250" rx="0" fill="#167a9b0d" stroke="none"/><rect x="475" y="150" width="156.25" height="250" rx="0" fill="#167a9b0d" stroke="none"/><polyline points="100,366.15 256.25,183.85 475,366.15 631.25,183.85 850,366.15" fill="none" stroke="#167a9b" stroke-width="3" stroke-linejoin="round"/><line x1="100" y1="275" x2="850" y2="275" stroke="#657981" stroke-width="1.5" stroke-dasharray="6 5"/><text x="102" y="120" font-size="18" fill="#167a9b" text-anchor="start">导通斜率 +0.7 A/μs</text><text x="490" y="120" font-size="18" fill="#c45842" text-anchor="start">关断斜率 −0.5 A/μs</text><rect x="30" y="447" width="900" height="70" rx="5" fill="#f1f6f6" stroke="none"/><text x="48" y="473" font-size="17" fill="#263b43" text-anchor="start">理想 CCM：12 V → 5 V，500 kHz，10 μH，负载 3 A；ΔIL ≈ 0.583 A。</text><text x="48" y="500" font-size="17" fill="#657981" text-anchor="start">峰值 3.292 A、谷值 2.708 A；IL,rms = √(Io² + ΔIL²/12) ≈ 3.005 A。</text></g></svg>
