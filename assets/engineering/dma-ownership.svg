<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc">
<title id="title">DMA 半缓冲交接的所有权与截止时间</title><desc id="desc">16格循环缓冲分为A和B两个半区。CPU读取已完成的A时DMA写B，CPU必须在DMA再次回到A前读完，否则发生覆盖。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#507880"/></marker></defs>
<rect width="960" height="540" fill="#fff"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="30" y="43" font-size="28" fill="#263b43" text-anchor="start">DMA 半缓冲交接的所有权与截止时间</text><text x="30" y="77" font-size="17" fill="#657981" text-anchor="start">完成标志只能发布状态；它不能阻止 DMA 绕回并覆盖尚未处理的数据。</text><text x="50" y="142" font-size="20" fill="#263b43" text-anchor="start">循环缓冲区</text><rect x="50" y="165" width="50" height="65" rx="0" fill="#e5f1f7" stroke="#fff"/><text x="75" y="204" font-size="18" fill="#263b43" text-anchor="middle">0</text><rect x="103" y="165" width="50" height="65" rx="0" fill="#e5f1f7" stroke="#fff"/><text x="128" y="204" font-size="18" fill="#263b43" text-anchor="middle">1</text><rect x="156" y="165" width="50" height="65" rx="0" fill="#e5f1f7" stroke="#fff"/><text x="181" y="204" font-size="18" fill="#263b43" text-anchor="middle">2</text><rect x="209" y="165" width="50" height="65" rx="0" fill="#e5f1f7" stroke="#fff"/><text x="234" y="204" font-size="18" fill="#263b43" text-anchor="middle">3</text><rect x="262" y="165" width="50" height="65" rx="0" fill="#e5f1f7" stroke="#fff"/><text x="287" y="204" font-size="18" fill="#263b43" text-anchor="middle">4</text><rect x="315" y="165" width="50" height="65" rx="0" fill="#e5f1f7" stroke="#fff"/><text x="340" y="204" font-size="18" fill="#263b43" text-anchor="middle">5</text><rect x="368" y="165" width="50" height="65" rx="0" fill="#e5f1f7" stroke="#fff"/><text x="393" y="204" font-size="18" fill="#263b43" text-anchor="middle">6</text><rect x="421" y="165" width="50" height="65" rx="0" fill="#e5f1f7" stroke="#fff"/><text x="446" y="204" font-size="18" fill="#263b43" text-anchor="middle">7</text><rect x="474" y="165" width="50" height="65" rx="0" fill="#e9f3eb" stroke="#fff"/><text x="499" y="204" font-size="18" fill="#263b43" text-anchor="middle">8</text><rect x="527" y="165" width="50" height="65" rx="0" fill="#e9f3eb" stroke="#fff"/><text x="552" y="204" font-size="18" fill="#263b43" text-anchor="middle">9</text><rect x="580" y="165" width="50" height="65" rx="0" fill="#e9f3eb" stroke="#fff"/><text x="605" y="204" font-size="18" fill="#263b43" text-anchor="middle">10</text><rect x="633" y="165" width="50" height="65" rx="0" fill="#e9f3eb" stroke="#fff"/><text x="658" y="204" font-size="18" fill="#263b43" text-anchor="middle">11</text><rect x="686" y="165" width="50" height="65" rx="0" fill="#e9f3eb" stroke="#fff"/><text x="711" y="204" font-size="18" fill="#263b43" text-anchor="middle">12</text><rect x="739" y="165" width="50" height="65" rx="0" fill="#e9f3eb" stroke="#fff"/><text x="764" y="204" font-size="18" fill="#263b43" text-anchor="middle">13</text><rect x="792" y="165" width="50" height="65" rx="0" fill="#e9f3eb" stroke="#fff"/><text x="817" y="204" font-size="18" fill="#263b43" text-anchor="middle">14</text><rect x="845" y="165" width="50" height="65" rx="0" fill="#e9f3eb" stroke="#fff"/><text x="870" y="204" font-size="18" fill="#263b43" text-anchor="middle">15</text><text x="255" y="260" font-size="21" fill="#167a9b" text-anchor="middle">A 半区：已完成，CPU 消费</text><text x="685" y="260" font-size="21" fill="#347d61" text-anchor="middle">B 半区：DMA 正在写入</text><rect x="50" y="315" width="185" height="57" rx="5" fill="#f4f7f8" stroke="#e2e9ec"/><text x="143" y="350" font-size="19" fill="#263b43" text-anchor="middle">DMA 写 A</text><path d="M240,343 L270,343" fill="none" stroke="#167a9b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="275" y="315" width="185" height="57" rx="5" fill="#f4f7f8" stroke="#e2e9ec"/><text x="368" y="350" font-size="19" fill="#263b43" text-anchor="middle">A 完成 / 发布</text><path d="M465,343 L495,343" fill="none" stroke="#167a9b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="500" y="315" width="185" height="57" rx="5" fill="#f4f7f8" stroke="#e2e9ec"/><text x="593" y="350" font-size="19" fill="#263b43" text-anchor="middle">CPU 读 A</text><path d="M690,343 L720,343" fill="none" stroke="#167a9b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="725" y="315" width="185" height="57" rx="5" fill="#f4f7f8" stroke="#e2e9ec"/><text x="818" y="350" font-size="19" fill="#263b43" text-anchor="middle">A 已消费</text><text x="50" y="412" font-size="20" fill="#c45842" text-anchor="start">截止时间：DMA 写完 B、再次回到 A 之前，CPU 必须完成读取或复制。</text><rect x="30" y="447" width="900" height="70" rx="5" fill="#f1f6f6" stroke="none"/><text x="48" y="473" font-size="17" fill="#263b43" text-anchor="start">例：UART 1 Mbaud、8N1，数据率约 100 kB/s；512 B 半区对应约 5.12 ms。</text><text x="48" y="500" font-size="17" fill="#657981" text-anchor="start">5.12 ms 还要扣除中断、调度和抢占延迟；带 Cache 的 MCU 另需保证 DMA 与 CPU 一致性。</text></g></svg>
