0" rx="5" fill="#f1f6f6" stroke="none"/><text x="48" y="473" font-size="17" fill="#263b43" text-anchor="start">独立同分布、同一试验条件、零失效：单侧 95% 上界 p = 1 − 0.05^(1/n)。</text><text x="48" y="500" font-size="17" fill="#657981" text-anchor="start">这是规定试验的失效概率上界，不是每小时失效率，也不能直接外推到现场十年。</text></g></svg>
