<title id="title">负载阶跃中的 ESR 台阶与电荷缺口</title><desc id="desc">在1安电流缺口下，100微法电容以每微秒10毫伏的速度放电，20毫欧ESR额外造成20毫伏台阶，20微秒时合计跌落220毫伏。</desc>
