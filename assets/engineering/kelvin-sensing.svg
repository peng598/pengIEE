<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc">
<title id="title">Kelvin 采样把功率压降排除在测量之外</title><desc id="desc">5安功率电流流过2毫欧铜箔和10毫欧分流器。独立蓝色感测线只取分流器两端50毫伏，避免铜箔10毫伏导致20%误差。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#507880"/></marker></defs>
<rect width="960" height="540" fill="#fff"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="30" y="43" font-size="28" fill="#263b43" text-anchor="start">Kelvin 采样把功率压降排除在测量之外</text><text x="30" y="77" font-size="17" fill="#657981" text-anchor="start">红线输送负载电流；蓝线为高输入阻抗的独立感测连接。</text><path d="M70,210 L210,210" fill="none" stroke="#c45842" stroke-width="2.5" marker-end="url(#arrow)"/><text x="70" y="180" font-size="20" fill="#c45842" text-anchor="start">功率电流 5 A</text><line x1="210" y1="210" x2="268" y2="210" stroke="#c45842" stroke-width="2"/><rect x="268" y="198" width="64" height="24" rx="0" fill="#fff" stroke="#c45842"/><line x1="332" y1="210" x2="390" y2="210" stroke="#c45842" stroke-width="2"/><text x="300" y="186" font-size="18" fill="#c45842" text-anchor="middle">铜箔 2 mΩ</text><line x1="390" y1="210" x2="498" y2="210" stroke="#c45842" stroke-width="2"/><rect x="498" y="198" width="64" height="24" rx="0" fill="#fff" stroke="#c45842"/><line x1="562" y1="210" x2="670" y2="210" stroke="#c45842" stroke-width="2"/><text x="530" y="186" font-size="18" fill="#c45842" text-anchor="middle">分流器 10 mΩ</text><path d="M670,210 L880,210" fill="none" stroke="#c45842" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="430" cy="210" r="4" fill="#263b43"/><circle cx="630" cy="210" r="4" fill="#263b43"/><line x1="430" y1="210" x2="430" y2="290" stroke="#167a9b" stroke-width="2"/><line x1="630" y1="210" x2="630" y2="290" stroke="#167a9b" stroke-width="2"/><line x1="430" y1="290" x2="485" y2="290" stroke="#167a9b" stroke-width="2"/><line x1="630" y1="290" x2="575" y2="290" stroke="#167a9b" stroke-width="2"/><rect x="485" y="265" width="90" height="80" rx="5" fill="#eff7fa" stroke="#167a9b"/><text x="530" y="300" font-size="20" fill="#167a9b" text-anchor="middle">检测</text><text x="530" y="326" font-size="18" fill="#167a9b" text-anchor="middle">50 mV</text><text x="230" y="386" font-size="21" fill="#c45842" text-anchor="start">若把左侧铜箔压降计入：+10 mV → +20% 读数误差</text><rect x="30" y="447" width="900" height="70" rx="5" fill="#f1f6f6" stroke="none"/><text x="48" y="473" font-size="17" fill="#263b43" text-anchor="start">四线采样从器件规定的 Kelvin 感测点引出；功率焊盘与细采样线的连接位置不可随意替代。</text><text x="48" y="500" font-size="17" fill="#657981" text-anchor="start">此图说明直流连接误差；高速电流检测还要分析共模阶跃、寄生电感、放大器建立与滤波。</text></g></svg>
