---
layout: default
---
<article class="article">
  <header class="article-meta">
    <a href="{{ '/' | relative_url }}">笔记首页</a>
    <span class="meta-separator" aria-hidden="true">/</span>
    <span>{{ page.category }}</span>
    <span class="meta-separator" aria-hidden="true">/</span>
    {% if page.order == 0 %}
      <span>学习导览</span>
    {% else %}
      <span>第 {{ page.order }} 篇</span>
    {% endif %}
  </header>
  <div class="article-layout">
    <div class="prose">
      {{ content }}
    </div>
    <aside class="article-toc" aria-label="本页目录">
      <p>本页目录</p>
      <ol class="article-toc-list"></ol>
    </aside>
  </div>
</article>
