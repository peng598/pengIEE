<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.summary | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title | escape }} - {% endif %}{{ site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
    <script>
      window.MathJax = {
        tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
        options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到正文</a>
    {% assign note_pages = site.pages | where_exp: "item", "item.category" | sort: "order" %}
    <div class="site-shell">
      <aside class="sidebar">
        <a class="brand" href="{{ '/' | relative_url }}">
          <span class="brand-mark" aria-hidden="true">P</span>
          <span><strong>{{ site.title }}</strong><small>学习笔记</small></span>
        </a>
        <nav aria-label="主导航" class="navigation">
          <a class="nav-home{% if page.url == '/' %} is-active{% endif %}" href="{{ '/' | relative_url }}">笔记首页</a>
          <p class="nav-label">嵌入式系统</p>
          {% for item in note_pages %}
            <a class="nav-note{% if page.url == item.url %} is-active{% endif %}" href="{{ item.url | relative_url }}">{{ item.title }}</a>
          {% endfor %}
        </nav>
        <div class="sidebar-bottom">
          <span class="status-dot" aria-hidden="true"></span>
          <span>持续整理中</span>
        </div>
      </aside>
      <main id="main" class="main-content">
        {{ content }}
        <footer class="site-footer">
          <span>{{ site.title }}</span>
          <a href="https://github.com/peng598/PENGIEE">GitHub 仓库</a>
        </footer>
      </main>
    </div>
    <script type="module">
      import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
      mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'strict' });
      document.querySelectorAll('.language-mermaid pre code').forEach((code) => {
        const diagram = document.createElement('pre');
        diagram.className = 'mermaid';
        diagram.textContent = code.textContent;
        code.closest('.language-mermaid').replaceWith(diagram);
      });
      mermaid.run({ querySelector: '.mermaid' });
    </script>
  </body>
</html>
